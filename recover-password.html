<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://esm.sh; style-src 'self'; img-src 'self' data: blob: https://qbmhcudgtjooyyegdhkk.supabase.co; media-src 'self' blob: https://qbmhcudgtjooyyegdhkk.supabase.co; connect-src 'self' https://qbmhcudgtjooyyegdhkk.supabase.co https://esm.sh; font-src 'self' data:"> <meta name="theme-color" content="#101411">
  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/reset.css"><link rel="stylesheet" href="./assets/css/variables.css"><link rel="stylesheet" href="./assets/css/base.css"><link rel="stylesheet" href="./assets/css/components.css"><link rel="stylesheet" href="./assets/css/pages.css">
  <title>Recuperar contraseña · MUSIC PLAYER</title>
</head>
<body class="auth-page auth-page-simple">
  <main class="auth-simple-shell"><a class="brand-lockup" href="./index.html"><span class="brand-mark">♫</span><span>MUSIC PLAYER</span></a>
    <section class="auth-card auth-recovery"><span class="eyebrow">SEGURIDAD DE TU CUENTA</span><h2 id="recovery-title">Recuperar contraseña</h2><p class="muted" id="recovery-description">Escribe el correo asociado a tu cuenta. Recibirás un enlace si el servicio de correo está configurado.</p>
      <form id="recovery-request-form" class="form-stack"><label>Correo electrónico<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="correo@ejemplo.com"></label><button class="button button-primary button-wide" type="submit">Enviar enlace</button><p class="form-message" id="recovery-request-message" role="status" aria-live="polite"></p></form>
      <form id="recovery-reset-form" class="form-stack hidden"><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="Mínimo 12 caracteres"></label><label>Confirma la contraseña<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button class="button button-primary button-wide" type="submit">Actualizar contraseña</button><p class="form-message" id="recovery-reset-message" role="status" aria-live="polite"></p></form>
      <p class="auth-switch"><a class="text-link" href="./login.html">Volver a iniciar sesión</a></p>
    </section><p class="auth-legal">Los enlaces de recuperación caducan en una hora y solo pueden utilizarse una vez.</p>
  </main>
  <script type="module" src="./assets/js/controllers/auth.controller.js"></script>
</body>
</html>
